<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Révision CCP3 Hybrid InfraSec</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one-screen phone app. Sticky header, scrolling view, fixed bottom tab bar. Single deliberate dark look: black and signal red, like the dossiers. */
:root{
  color-scheme: dark;
  --page:#09090b; --surface:#131317; --surface2:#1a1a20; --line:#2a2a31; --line2:#4a4a55;
  --text:#ebe7e8; --head:#ffffff; --muted:#a39ca1; --red:#e3192f; --red2:#ff5263; --redsoft:rgba(227,25,47,.15);
  --ok:#2bb673; --oksoft:rgba(43,182,115,.14); --amber:#f2a516; --th:#1d1d24; --fig-bg:#0d0d11; --chip:#202027;
  --f-display:'Chakra Petch', 'Poppins', system-ui, sans-serif;
  --f-body:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono:'JetBrains Mono', ui-monospace, 'DejaVu Sans Mono', monospace;
  --tab-h:62px;
}
*{ box-sizing:border-box }
html,body{ height:100% }
body{ background:var(--page); color:var(--text); font:15px/1.5 var(--f-body); -webkit-font-smoothing:antialiased }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--page) }
button{ font:inherit; color:inherit; cursor:pointer }
:focus-visible{ outline:2px solid var(--red2); outline-offset:2px }
.wrap{ max-width:760px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)) }

header.top{ position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:rgba(9,9,11,.94); backdrop-filter:blur(8px); border-bottom:1px solid var(--line) }
header.top .wrap{ display:flex; align-items:center; gap:12px; padding-block:10px }
.prompt{ font:600 12px/1 var(--f-mono); color:var(--red) }
.brand{ display:flex; flex-direction:column; gap:3px; min-width:0 }
.brand b{ font:700 17px/1.1 var(--f-display); color:var(--head); letter-spacing:.02em }
.brand span{ font:12px/1.2 var(--f-mono); color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.mem{ margin-left:auto; display:flex; align-items:center; gap:8px; font:600 12px var(--f-display); color:var(--muted); letter-spacing:.06em; text-transform:uppercase; white-space:nowrap; flex:none; background:none; border:1px solid var(--line2); border-radius:999px; padding:6px 10px }
.mem[aria-pressed="true"]{ color:#fff; border-color:var(--red); background:var(--redsoft) }
.mem i{ width:8px; height:8px; border-radius:50%; background:var(--line2) } .mem[aria-pressed="true"] i{ background:var(--red) }

main{ padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 24px) }
section.view{ display:flex; flex-direction:column; gap:22px; padding-block:18px 8px }
h1,h2,h3{ font-family:var(--f-display); color:var(--head); margin:0; text-wrap:balance }
h1{ font-size:26px; line-height:1.12; font-weight:700 }
h2{ font-size:19px; font-weight:700; display:flex; align-items:center; gap:10px }
h2::before{ content:""; width:9px; height:9px; background:var(--red); transform:rotate(45deg); flex:none }
h3{ font-size:16px; font-weight:600 }
.kick{ font:600 11.5px var(--f-mono); color:var(--red); letter-spacing:.12em; text-transform:uppercase }
.lead{ color:var(--muted); margin:0; max-width:62ch }
.block{ display:flex; flex-direction:column; gap:12px }
code,.mono{ font-family:var(--f-mono); font-size:.88em }
code{ background:var(--redsoft); color:#fff; padding:0 .3em; border-radius:3px }

/* layer badges (same colours as the dossier) */
.L{ display:inline-flex; align-items:center; justify-content:center; min-width:28px; height:20px; padding:0 7px; border-radius:10px; font:700 11px/1 var(--f-display); color:#fff; flex:none }
.node .L{ color:#fff; font:700 11px/1 var(--f-display) } .node .L.L2, .node .L.L4{ color:#111 }
.L1{ background:#6d6873 } .L2{ background:#9b97a0; color:#111 } .L3{ background:#ff7a33 } .L4{ background:#f2a516; color:#111 } .L5{ background:#b84cf0 } .L6{ background:#4c8df0 } .L7{ background:#e3192f }

/* topology */
.topo{ display:flex; flex-direction:column; gap:10px }
.zone{ border:1px dashed var(--line2); border-radius:10px; padding:12px; display:flex; flex-direction:column; gap:10px; position:relative }
.zone > .zl{ font:600 11px var(--f-mono); color:var(--muted); letter-spacing:.08em; text-transform:uppercase }
.zone.host{ border-color:var(--line2); border-style:solid; background:linear-gradient(180deg, rgba(255,255,255,.015), transparent) }
.bus{ display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:7px; background:var(--surface2); border:1px solid var(--line2); font:600 12.5px var(--f-display); color:var(--head) }
.bus.lan{ background:var(--redsoft); border-color:var(--red) }
.bus small{ font:12px var(--f-mono); color:var(--muted); font-weight:400 }
.nodes{ display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:8px }
.node{ text-align:left; display:flex; flex-direction:column; gap:3px; background:var(--surface); border:1px solid var(--line2); border-radius:8px; padding:9px 10px; transition:border-color .2s, box-shadow .2s, transform .2s; min-width:0 }
.node b{ font:600 14px var(--f-display); color:var(--head); display:flex; justify-content:space-between; gap:6px; align-items:center }
.node span{ font:12px/1.3 var(--f-mono); color:var(--red2); overflow-wrap:anywhere }
.node.fw{ border-color:var(--red); border-width:2px }
.node.on{ border-color:var(--red2); box-shadow:0 0 0 3px var(--redsoft), 0 0 22px rgba(227,25,47,.35); transform:translateY(-1px) }
.arrow{ text-align:center; color:var(--line2); font:12px var(--f-mono); line-height:1 }
.legend{ font-size:13px; color:var(--muted) }

/* path player */
.player{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:12px }
.chips{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none }
.chips::-webkit-scrollbar{ display:none }
.chip{ flex:none; border:1px solid var(--line2); background:var(--chip); border-radius:999px; padding:7px 12px; font:600 13px var(--f-display); color:var(--text); white-space:nowrap }
.chip[aria-pressed="true"]{ background:var(--red); border-color:var(--red); color:#fff }
.chain{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; font:12px var(--f-mono) }
.chain span{ padding:3px 8px; border-radius:5px; background:var(--surface2); border:1px solid var(--line); color:var(--muted) }
.chain span.on{ background:var(--red); border-color:var(--red); color:#fff }
.chain i{ color:var(--line2); font-style:normal }
.stepbox{ display:flex; gap:12px; align-items:flex-start; min-height:92px }
.stepn{ font:700 30px/1 var(--f-display); color:var(--red); font-variant-numeric:tabular-nums; flex:none; width:44px }
.stepbox p{ margin:0 }
.ctrl{ display:flex; gap:8px; align-items:center }
.btn{ border:1px solid var(--line2); background:var(--surface2); border-radius:8px; padding:9px 14px; font:600 14px var(--f-display); color:var(--head) }
.btn.red{ background:var(--red); border-color:var(--red); color:#fff }
.btn:disabled{ opacity:.35; cursor:default }
.dots{ display:flex; gap:5px; margin-left:auto } .dots i{ width:7px; height:7px; border-radius:50%; background:var(--line2) } .dots i.on{ background:var(--red) }

/* OSI */
.osi{ display:flex; flex-direction:column; gap:6px }
.layer{ background:var(--surface); border:1px solid var(--line); border-radius:9px; overflow:hidden }
.layer > button{ width:100%; display:flex; align-items:center; gap:10px; background:none; border:0; padding:11px 12px; text-align:left }
.layer > button b{ font:600 15px var(--f-display); color:var(--head) }
.layer > button em{ margin-left:auto; font-style:normal; color:var(--muted); font-size:13px; text-align:right }
.layer .in{ padding:0 12px 12px 50px; display:flex; flex-direction:column; gap:8px; font-size:14px }
.layer .in dl{ margin:0; display:flex; flex-direction:column; gap:12px }
.layer .in dt{ font:600 11px var(--f-mono); color:var(--red2); letter-spacing:.08em; text-transform:uppercase }
.layer .in dd{ margin:2px 0 0 }

/* memory veil */
.veil{ position:relative }
body.memo .veil:not(.shown) > .ans{ filter:blur(7px); opacity:.55; user-select:none; pointer-events:none }
body.memo .veil:not(.shown)::after{ content:"toucher pour révéler"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font:600 12px var(--f-mono); color:var(--red2); letter-spacing:.08em; text-transform:uppercase; cursor:pointer }

/* machine */
.vmhead{ display:flex; align-items:flex-start; gap:10px; justify-content:space-between }
.vmhead .ip{ font:13px var(--f-mono); color:var(--red2) }
.kv{ display:grid; grid-template-columns:minmax(92px, 30%) 1fr; border:1px solid var(--line); border-radius:9px; overflow:hidden; font-size:14px }
.kv > div{ padding:8px 10px; border-bottom:1px solid var(--line); min-width:0; overflow-wrap:anywhere }
.kv > div:nth-child(odd){ background:var(--th); color:var(--muted); font:600 12.5px var(--f-display) }
.kv > div:nth-last-child(-n+2){ border-bottom:0 }
.flows{ display:grid; grid-template-columns:1fr; gap:12px }
@media (min-width:640px){ .flows{ grid-template-columns:1fr 1fr } }
.flist{ display:flex; flex-direction:column; gap:6px }
.flist h3{ font-size:13px; color:var(--muted); letter-spacing:.08em; text-transform:uppercase }
.fl{ display:grid; grid-template-columns:22px 1fr auto; gap:8px; align-items:start; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13.5px }
.fl .ic{ width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; font:700 12px var(--f-display); background:var(--oksoft); color:var(--ok) }
.fl.no{ border-style:dashed; color:var(--muted) } .fl.no .ic{ background:var(--redsoft); color:var(--red2) }
.fl b{ display:block; color:var(--head); font-weight:600 }
.fl .pt{ font:600 12px var(--f-mono); color:var(--amber); white-space:nowrap; text-align:right }
.note{ font-size:13.5px; color:var(--muted); border-left:3px solid var(--red); padding:4px 0 4px 10px }

/* flowchart */
.flow{ display:flex; flex-direction:column; align-items:stretch }
.fs{ position:relative; display:flex; gap:12px; align-items:stretch }
.fs .rail{ width:30px; flex:none; display:flex; flex-direction:column; align-items:center }
.fs .rail i{ width:30px; height:30px; flex:none; border-radius:50%; background:var(--surface2); border:2px solid var(--line2); display:flex; align-items:center; justify-content:center; font:700 13px var(--f-display); font-style:normal; color:var(--head) }
.fs .rail::after{ content:""; flex:1; width:2px; background:var(--line2); margin:3px 0 }
.fs:last-child .rail::after{ display:none }
.fs.red .rail i{ background:var(--red); border-color:var(--red) }
.fs.ok .rail i{ border-color:var(--ok); color:var(--ok) }
.fs.dec .rail i{ border-radius:5px; transform:rotate(45deg); border-color:var(--amber); width:24px; height:24px; margin:3px 0 }
.fs.dec .rail i span{ transform:rotate(-45deg); color:var(--amber) }
.fs .card{ flex:1; min-width:0; background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:9px 11px; margin-bottom:10px; text-align:left }
.fs.dec .card{ border-color:var(--amber) } .fs.ok .card{ border-color:rgba(43,182,115,.55) }
.fs .card b{ font:600 15px var(--f-display); color:var(--head) }
.fs .card p{ margin:2px 0 0; font-size:13.5px; color:var(--text) }
.yn{ display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; font:12px var(--f-mono) }
.yn span{ padding:2px 7px; border-radius:4px; background:var(--oksoft); color:var(--ok) }
.yn span.n{ background:var(--redsoft); color:var(--red2) }
details.figs{ border:1px solid var(--line); border-radius:9px; background:var(--surface) }
details.figs summary{ padding:11px 12px; font:600 14px var(--f-display); color:var(--head); cursor:pointer }
details.figs > div{ padding:0 12px 12px; display:flex; flex-direction:column; gap:12px }
.svgscroll{ overflow-x:auto; border:1px solid var(--line); border-radius:7px; background:var(--fig-bg); -webkit-overflow-scrolling:touch }
.svgscroll svg{ display:block; width:100%; min-width:680px; height:auto }
.cap{ font-size:12.5px; color:var(--muted) }

/* cards / lists */
.seg{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:4px; position:sticky; top:calc(env(safe-area-inset-top,0px) + 58px); z-index:5 }
.seg button{ border:0; background:none; border-radius:7px; padding:8px 4px; font:700 15px var(--f-display); color:var(--muted) }
.seg button[aria-pressed="true"]{ background:var(--red); color:#fff }
.cards{ display:flex; flex-direction:column; gap:8px }
.it{ background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:11px 12px; display:flex; flex-direction:column; gap:4px }
.it h3{ font-size:15.5px }
.it p{ margin:0; font-size:14px }
.it.oct{ border-left:3px solid var(--red) }
.tag{ align-self:flex-start; font:600 10.5px var(--f-mono); letter-spacing:.08em; text-transform:uppercase; color:var(--red2); background:var(--redsoft); padding:2px 6px; border-radius:4px }
.tri{ display:grid; grid-template-columns:1fr; gap:6px; font-size:13.5px }
.tri div{ padding:6px 8px; border-radius:6px; background:var(--surface2) }
.tri div:first-child{ color:var(--muted) } .tri div:last-child{ background:var(--oksoft) }
.tri small{ display:block; font:600 10.5px var(--f-mono); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:2px }
.tbl{ overflow-x:auto; border:1px solid var(--line); border-radius:9px }
.tbl table{ border-collapse:collapse; width:100%; min-width:560px; font-size:13.5px }
.tbl th{ background:var(--th); text-align:left; padding:8px 10px; font:600 12.5px var(--f-display); color:var(--head); border-bottom:2px solid var(--red) }
.tbl td{ padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top }
.tbl td.mono{ color:var(--red2); white-space:nowrap }

/* flashcards */
.fc-tools{ display:flex; gap:6px; flex-wrap:wrap }
.flash{ perspective:1200px; min-height:260px }
.flash .in{ position:relative; min-height:260px; transition:transform .45s; transform-style:preserve-3d }
.flash.flip .in{ transform:rotateY(180deg) }
.face{ position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:14px; border:1px solid var(--line2); background:var(--surface); padding:18px; display:flex; flex-direction:column; gap:10px; overflow:auto }
.face.front{ justify-content:center; background:radial-gradient(120% 90% at 0% 0%, rgba(227,25,47,.18), transparent 60%), var(--surface) }
.face.back{ transform:rotateY(180deg) }
.face .fid{ font:700 34px/1 var(--f-display); color:var(--red) }
.face .ft{ font:600 19px/1.25 var(--f-display); color:var(--head) }
.face .hint{ margin-top:auto; font:12px var(--f-mono); color:var(--muted) }
.face dl{ margin:0; display:flex; flex-direction:column; gap:8px; font-size:14.5px }
.face dt{ font:600 11px var(--f-mono); color:var(--red2); letter-spacing:.08em; text-transform:uppercase }
.face dd{ margin:2px 0 0 }
.fc-nav{ display:flex; gap:8px; align-items:center; flex-wrap:wrap }
.fc-nav .count{ margin-left:auto; font:600 13px var(--f-mono); color:var(--muted); font-variant-numeric:tabular-nums }
.btn.ok{ background:var(--oksoft); border-color:var(--ok); color:var(--ok) }

/* quiz */
.qbar{ height:6px; background:var(--surface2); border-radius:3px; overflow:hidden } .qbar i{ display:block; height:100%; background:var(--red); transition:width .3s }
.qq{ font:600 18px/1.35 var(--f-display); color:var(--head) }
.opts{ display:flex; flex-direction:column; gap:8px }
.opt{ text-align:left; background:var(--surface); border:1px solid var(--line2); border-radius:9px; padding:12px 13px; font-size:15px }
.opt.good{ border-color:var(--ok); background:var(--oksoft) } .opt.bad{ border-color:var(--red); background:var(--redsoft) }
.why{ font-size:14px; padding:10px 12px; border-radius:8px; background:var(--surface2) }
.score{ font:700 52px/1 var(--f-display); color:var(--red); font-variant-numeric:tabular-nums }

/* oral */
ol.oral{ margin:0; padding:0; list-style:none; counter-reset:o; display:flex; flex-direction:column; gap:8px }
ol.oral li{ counter-increment:o; display:grid; grid-template-columns:34px 1fr; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:11px 12px; font-size:15px }
ol.oral li::before{ content:counter(o, decimal-leading-zero); font:700 16px var(--f-display); color:var(--red) }
.search{ width:100%; background:var(--surface); border:1px solid var(--line2); border-radius:9px; padding:11px 12px; color:var(--text); font:15px var(--f-body) }
.gl{ display:flex; flex-direction:column; border:1px solid var(--line); border-radius:9px; overflow:hidden }
.gl div{ display:grid; grid-template-columns:96px 1fr; gap:10px; padding:8px 10px; border-bottom:1px solid var(--line); font-size:13.5px }
.gl div:last-child{ border-bottom:0 }
.gl b{ font:600 13px var(--f-mono); color:var(--red2) }

/* tab bar */
nav.tabs{ position:fixed; left:0; right:0; bottom:0; z-index:25; background:rgba(13,13,16,.97); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px); padding-left:env(safe-area-inset-left,0px); padding-right:env(safe-area-inset-right,0px) }
nav.tabs .row{ max-width:760px; margin:0 auto; display:grid; grid-template-columns:repeat(6,1fr); height:var(--tab-h) }
nav.tabs a{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; text-decoration:none; color:var(--muted); font:600 11px var(--f-display); letter-spacing:.03em }
nav.tabs a svg{ width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.8 }
nav.tabs a[aria-current="page"]{ color:#fff } nav.tabs a[aria-current="page"] svg{ stroke:var(--red) }

/* overlay */
.ov{ position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.92); display:flex; flex-direction:column; padding:calc(env(safe-area-inset-top,0px) + 10px) max(10px, env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(10px, env(safe-area-inset-left,0px)) }
.ov .bar{ display:flex; gap:8px; align-items:center; padding-bottom:8px }
.ov .bar b{ font:600 14px var(--f-display); color:#fff; margin-right:auto }
.ov .sc{ flex:1; overflow:auto; border-radius:8px; background:var(--fig-bg); -webkit-overflow-scrolling:touch }
.ov .sc svg{ display:block; height:auto }
.sheet{ position:fixed; left:0; right:0; bottom:0; z-index:35; background:var(--surface); border-top:2px solid var(--red); border-radius:14px 14px 0 0; padding:16px max(16px, env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px, env(safe-area-inset-left,0px)); display:flex; flex-direction:column; gap:10px; max-height:72%; overflow:auto; box-shadow:0 -20px 40px rgba(0,0,0,.6) }
.sheet .ip{ font:13px var(--f-mono); color:var(--red2) }
@media (prefers-reduced-motion:reduce){ *{ transition:none!important } }
.abbr{ font-size:13px; line-height:1.55; color:var(--muted); border:1px dashed var(--line2); border-radius:9px; padding:10px 12px }
.abbr b{ color:var(--red2); font-family:var(--f-mono); font-weight:600 }
.abbr .h{ display:block; font:600 11px var(--f-mono); color:var(--text); letter-spacing:.1em; text-transform:uppercase; margin-bottom:4px }
/* svg classes */
.fig-bg{ fill:var(--fig-bg) }
.box{ fill:var(--surface); stroke:var(--line2); stroke-width:1.2 }
.box-red{ fill:var(--surface); stroke:var(--red); stroke-width:2 }
.box-dash{ fill:var(--surface); stroke:var(--line2); stroke-width:1.2; stroke-dasharray:5 4 }
.box-dec{ fill:var(--surface2); stroke:var(--amber); stroke-width:1.6 }
.box-ok{ fill:var(--surface); stroke:var(--ok); stroke-width:2 }
.box-deny{ fill:var(--surface2); stroke:var(--line2); stroke-width:1.2; stroke-dasharray:4 4 }
.frame{ fill:none; stroke:var(--line2); stroke-width:1.2; stroke-dasharray:6 5 }
.bar{ fill:var(--surface2); stroke:var(--line2); stroke-width:1.2 }
.bar-red{ fill:var(--redsoft); stroke:var(--red); stroke-width:1.6 }
.row{ fill:var(--surface2) } .row2{ fill:var(--surface) }
.thead{ fill:var(--th); stroke:var(--red); stroke-width:0 }
.t{ fill:var(--text); font-family:'IBM Plex Sans',Carlito,sans-serif } .tt{ fill:var(--head); font-family:'Chakra Petch',Poppins,sans-serif }
.tm{ fill:var(--muted); font-family:'IBM Plex Sans',Carlito,sans-serif } .tr{ fill:var(--red); font-family:'Chakra Petch',Poppins,sans-serif } .tw{ fill:#fff; font-family:'Chakra Petch',Poppins,sans-serif }

-weight=\"700\" >L1<\/text><text x=\"64\" y=\"1323\" class=\"tt\" font-size=\"12.5\" text-anchor=\"start\" font-weight=\"700\" >1 · Physique<\/text><text x=\"180\" y=\"1322\" class=\"t\" font-size=\"11.8\" text-anchor=\"start\" >ASUS ROG Strix G18 : NVMe 952 Go, 30 Gio de RAM,<\/text><text x=\"180\" y=\"1339\" class=\"t\" font-size=\"11.8\" text-anchor=\"start\" >Wi-Fi wlo1 ; aucun câble vers le LAN du labo<\/text><text x=\"585\" y=\"1322\" class=\"t\" font-size=\"11.8\" text-anchor=\"start\" >chiffrement complet LUKS, instantanés Snapper/BTRFS,<\/text><text x=\"585\" y=\"1339\" class=\"t\" font-size=\"11.8\" text-anchor=\"start\" >sauvegarde lab-backup en lecture seule (PV-09)<\/text><\/svg>", "full": true, "cap": "Architecture réseau générale du labo Hybrid InfraSec : topologie complète et lecture couche par couche du modèle OSI (état au 26/10/2026).", "abbr": ["L1…L7", "OSI", "HV01", "KVM", "LUKS", "BTRFS", "NAT", "WAN", "LAN", "WG", "DNS", "NTP", "AD DS", "LDAP", "SMB", "SNMP", "TLS", "SSH", "GPO", "AGDLP", "RBAC", "FIM", "whodata", "TCP / UDP", "ufw", "DC", "SIEM", "VM", "Gio / Go", "agent invité"], "abbrHtml": "<b>L1…L7<\/b> : couches du modèle OSI : 1 physique, 2 liaison, 3 réseau, 4 transport, 5 session, 6 présentation, 7 application · <b>OSI<\/b> : modèle de référence en 7 couches (Open Systems Interconnection) · <b>HV01<\/b> : hyperviseur du labo, nom d'hôte TeneT · <b>KVM<\/b> : hyperviseur intégré au noyau Linux (Kernel-based Virtual Machine) · <b>LUKS<\/b> : chiffrement complet du disque sous Linux (Linux Unified Key Setup) · <b>BTRFS<\/b> : système de fichiers à instantanés (B-tree file system) · <b>NAT<\/b> : traduction d'adresses (Network Address Translation) · <b>WAN<\/b> : côté extérieur du pare-feu (réseau NAT 192.168.122.0/24) · <b>LAN<\/b> : réseau local du labo 10.10.10.0/24 · <b>WG<\/b> : WireGuard : tunnel VPN chiffré, port UDP 51820 · <b>DNS<\/b> : résolution des noms (Domain Name System) · <b>NTP<\/b> : synchronisation de l'heure (Network Time Protocol) · <b>AD DS<\/b> : services de domaine Active Directory · <b>LDAP<\/b> : protocole d'accès à l'annuaire (Lightweight Directory Access Protocol) · <b>SMB<\/b> : partage de fichiers Windows (Server Message Block), port 445 · <b>SNMP<\/b> : supervision des équipements réseau (Simple Network Management Protocol), port UDP 161 · <b>TLS<\/b> : chiffrement des échanges (Transport Layer Security) · <b>SSH<\/b> : administration à distance chiffrée (Secure Shell), port 22 · <b>GPO<\/b> : stratégie de groupe Windows (Group Policy Object) · <b>AGDLP<\/b> : comptes → groupes Globaux → groupes de Domaine Local → Permissions · <b>RBAC<\/b> : contrôle d'accès fondé sur les rôles (Role-Based Access Control) · <b>FIM<\/b> : surveillance de l'intégrité des fichiers (File Integrity Monitoring) · <b>whodata<\/b> : mode FIM de Wazuh qui enregistre aussi l'auteur et le processus · <b>TCP / UDP<\/b> : protocoles de transport, avec ou sans connexion · <b>ufw<\/b> : pare-feu local de Debian et Ubuntu (Uncomplicated Firewall) · <b>DC<\/b> : contrôleur de domaine (Domain Controller) · <b>SIEM<\/b> : collecte et corrélation des journaux de sécurité (Security Information and Event Management) · <b>VM<\/b> : machine virtuelle · <b>Gio / Go<\/b> : gibioctets (mémoire, 2³⁰ octets) / gigaoctets (disque, 10⁹ octets) · <b>agent invité<\/b> : service QEMU dans la VM qui reçoit les ordres de l'hyperviseur (guest agent)"}, "figs": {"detection": {"svg": "<svg class=\"fig\" viewBox=\"0 0 1000 330\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"0\" y=\"0\" width=\"1000\" height=\"330\" rx=\"0\" class=\"fig-bg\" /><line x1=\"700\" y1=\"20\" x2=\"700\" y2=\"262\" class=\"ln-red\" stroke-dasharray=\"6 5\"/><text x=\"700\" y=\"16\" class=\"tr\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"700\" >seuil d'alerte : niveau 10<\/text><text x=\"14\" y=\"52\" class=\"tr\" font-size=\"12.5\" text-anchor=\"start\" font-weight=\"700\" >F-19<\/tex "Qui ouvre la session, et avec quelle preuve d'identité."}, {"l": "L4", "name": "Transport", "lab": "TCP 22 53 88 389 443 445 636 1514 1515 3000 8080 9090 9100 9182 55000 · UDP 53 123 161 51820", "ctl": "pfSense à états, refus par défaut ; ufw sur le SIEM et sur Samba (F-15, F-25) ; profil Domaine sur le DC", "mem": "Les ports : un port ouvert = un flux légitime nommé."}, {"l": "L3", "name": "Réseau", "lab": "LAN 10.10.10.0/24, WAN 192.168.122.0/24, tunnel 10.10.20.0/24 ; routage et NAT par pfSense", "ctl": "Une seule sortie : pfSense. Transfert de l'hôte bloqué par la zone lab-tenet (F-13). WireGuard par clés", "mem": "Trois réseaux, un seul point de passage."}, {"l": "L2", "name": "Liaison", "lab": "Ponts Linux br-tenet et virbr0, interfaces vnetN, cartes virtio-net, adresses MAC des VM", "ctl": "br-tenet sans carte physique : LAN isolé. br_netfilter non chargé, le trafic entre VM reste en couche 2", "mem": "Les ponts virtuels : le LAN n'a aucun câble vers l'extérieur."}, {"l": "L1", "name": "Physique", "lab": "ASUS ROG Strix G18 : NVMe 952 Go, 30 Gio de RAM, Wi-Fi wlo1 ; aucun câble vers le LAN du labo", "ctl": "Chiffrement complet LUKS, instantanés Snapper/BTRFS, sauvegarde lab-backup en lecture seule (PV-09)", "mem": "Le portable : disque chiffré, sauvegarde immuable."}], "paths": [{"id": "smb", "title": "Un salarié en télétravail ouvre le partage Projets", "steps": [["wgclient", "L3", "wg-client (192.168.122.55) lance wg-quick up : l'interface wg0 prend 10.10.20.3."], ["pfsense", "L4", "Le paquet UDP 51820 arrive sur le WAN de pfSense (192.168.122.95), seul port ouvert côté WAN."], ["pfsense", "L5", "pfSense vérifie la clé publique du pair et son adresse autorisée /32. Clé inconnue : paquet ignoré, invisible."], ["pfsense", "L6", "Déchiffrement ChaCha20-Poly1305 ; le trafic sort sur l'interface WG_REMOTE."], ["pfsense", "L4", "Règle du profil salarié : TCP 445 vers 10.10.10.20 seulement. Tout le reste est bloqué et journalisé."], ["truenas", "L7", "TrueNAS demande au DC (Kerberos, 88) qui est l'utilisateur. 10 échecs : compte verrouillé."], ["truenas", "L7", "L'ACL du partage décide : DL_SMB_Projets_RW modifie, DL_SMB_Projets_RO lit, les autres sont refusés."], ["truenas", "L7", "L'accès est audité (qui, quoi, quand, depuis où : F-20) et protégé par un instantané ZFS horaire."]]}, {"id": "persist", "title": "Un attaquant pose un fichier dans le dossier de démarrage du DC", "steps": [["dc01", "L7", "maj.bat est créé dans C:\\ProgramData\\…\\StartUp à 18:52:00 UTC (technique T1547.001)."], ["dc01", "L7", "L'agent Wazuh 002 le voit en temps réel grâce au FIM whodata : il sait quel compte l'a écrit."], ["wazuh", "L4", "L'événement part vers le SIEM sur TCP 1514, seul flux que ufw accepte depuis le LAN."], ["wazuh", "L7", "Le manager décode : les chemins Windows sont en minuscules, d'où le filtre insensible à la casse."], ["wazuh", "L7", "La règle native 554 donnait le niveau 5 (sous le seuil). La règle locale 100300 la relève au niveau 12."], ["wazuh", "L7", "Alerte à 18:52:01.582, soit 1,6 s après la création, rangée sous MITRE T1547.001."], ["wazuh", "L6", "La nuit, alerts.json est compressé et scellé en SHA-256 (00:30 UTC, rattrapage au démarrage)."]]}, {"id": "boot", "title": "Le labo démarre le matin (sudo lab start)", "steps": [["hv01", "L1", "Sur HV01, le script lab écrit chaque étape dans le journal système (journalctl -t lab)."], ["pfsense", "L4", "pfsense-fw d'abord. Le script attend que 10.10.10.254:443 réponde."], ["dc01", "L7", "Win-Server-DC. Attente d'un DNS NOERROR avec un enregistrement réel : un message d'erreur ne compte pas (F-14)."], ["lnxdc", "L7", "lnx-dc01, même attente DNS pour infrasec.internal."], ["truenas", "L7", "TrueNAS et fedora : le stockage puis la supervision."], ["wazuh", "L7", "wazuh-siem en dernier : le DNS répond, donc le flux CVE se met à jour."], ["hv01", "L1", "Le soir, lab stop arrête dans l'ordre inverse : agent invité QEMU, sinon ACPI, jamais de forçage (F-26). 7 VM sur 7 en 66 s."]]}], "topo": [{"id": "inet", "name": "Internet", "ip": "aucun service exposé", "l": "L3", "zone": "ext"}, {"id": "acc", "name": "Réseau d'accès", "ip": "192.168.1.0/24", "l": "L3", "zone": "ext"}, {"id": "hv01", "name": "HV01 · TeneT", "ip": "wlo1 192.168.1.188 · br-tenet .2", "l": "L3", "zone": "host"}, {"id": "wgclient", "name": "wg-client", "ip": "192.168.122.55", "l": "L7", "zone": "wan"}, {"id": "pfsense", "name": "pfsense-fw", "ip": "WAN .95 · LAN .254 · wg 10.10.20.1", "l": "L3-L4", "zone": "fw"}, {"id": "dc01", "name": "Win-Server-DC", "ip": "10.10.10.10", "l": "L7", "zone": "lan"}, {"id": "lnxdc", "name": "lnx-dc01", "ip": "10.10.10.11", "l": "L7", "zone": "lan"}, {"id": "truenas", "name": "truenas", "ip": "10.10.10.20", "l": "L7", "zone": "lan"}, {"id": "fedora", "name": "fedora", "ip": "10.10.10.30", "l": "L7", "zone": "lan"}, {"id": "wazuh", "name": "wazuh-siem", "ip": "10.10.10.40", "l": "L7", "zone": "lan"}], "jury": [["Lecture des journaux par l'interface graphique", "Toutes les preuves sont maintenant obtenues en ligne de commande : journalctl --list-boots puis -b -N, zgrep, grep dans alerts.json, midclt call audit.query, journalctl -t lab. Le DC est administré par SSH, par clé."], ["Architecture par machine", "Un schéma général couche par couche (OSI), puis une fiche par machine : tableau, flux réseau, organigramme du travail interne."], ["Les 10 salariés virtuels", "Entreprise créée par script idempotent depuis un seul employes.csv : 6 services, 10 salariés, AGDLP, 6 accès testés dont 2 refus, rejouée sur un second domaine Samba."], ["Confusion disponibilité / sécurité", "Une section dédiée et des fiches où une mesure de sécurité cassait la disponibilité, avec la mesure qui concilie les deux."], ["Abréviations (CERT, G/V)", "Sous chaque figure, toutes ses abréviations. CERT : centre de réponse aux incidents. G/V : gravité et vraisemblance, les deux axes EBIOS RM."]], "dispo": [["Cockpit (INC-08)", "Lier le service à une adresse : la console disparaît hors du réseau.", "Le service écoute partout ; le pare-feu filtre la source."], ["Clé de la CA du SIEM (F-22)", "La détruire : plus de renouvellement. La garder en clair : confidentialité perdue.", "Chiffrée AES-256, hors du SIEM, dans le coffre de l'hôte."], ["Mémoire de l'hôte (F-23)", "Réduire toutes les VM au hasard : le SIEM serait tombé.", "Mesurer, réduire seulement les deux VM surdimensionnées."], ["Verrouillage (F-24)", "Le seuil protège, mais un attaquant lent peut verrouiller tout le monde.", "Garder le seuil et alerter sur le verrouillage (100320)."], ["Sauvegarde (PV-09)", "Une sauvegarde modifiable peut être chiffrée par un rançongiciel.", "Lecture seule : restaurable, intouchable."]], "defauts": [["Un test qui ne peut pas échouer", "DNS qui accepte l'erreur (F-14), pare-feu testé depuis la cible (F-15), gpupdate « réussi » sans GPO (F-17), déchiffrement vide (F-22).", "Avant de croire un test, je vérifie qu'il aurait pu échouer."], ["Une configuration non déclarée", "Adresse ajoutée à la main (INC-10), pod lancé à la main (INC-09).", "Ce qui n'est pas dans l'outil de configuration disparaît au premier rechargement."], ["Un événement vu sous le seuil", "Persistance niveau 5, arrêt d'agent niveau 3, verrouillage niveau 9, créations de comptes niveau 8.", "Voir ne suffit pas : il faut atteindre le niveau qui alerte."], ["Une machine sans pare-feu ni supervision", "Le SIEM (F-15, F-16), le contrôleur Samba (F-25).", "Une machine entre dans le labo avec pare-feu, agent et supervision."]], "rules": [["100300", "T1547.001", "persistance par le dossier de démarrage", "550, 554", "12", "maj.bat à 18:52:00, alerte à 18:52:01.582"], ["100310", "T1562.001", "neutralisation d'un outil de défense", "506", "10", "sc.exe stop WazuhSvc, alerte à 18:52:35"], ["100320", "T1110", "force brute, y compris lente", "60115", "10", "10 échecs en 8 min, alerte sans 60204"], ["100100", "T1110", "force brute SSH", "projet", "12", "5 échecs en 60 s, alerte en 2 s"]], "cp": [{"cp": "CP8", "title": "Mesurer et analyser le niveau de sécurité", "items": [["La boucle sécurité", "Lettre de mission → audit → évaluation → EBIOS RM → PSSI et durcissement → détection et RETEX → retour à l'audit. Chaque étape lance la suivante."], ["Mission d'abord", "Lettre de mission du 01/10 : objectifs, périmètre de 5 composants, hyperviseur hors périmètre, référentiels ANSSI, CIS, EBIOS, MITRE, tests non destructifs. Audit conduit le 04/10 (PV-02). Écart tracé : pas d'OpenVAS."], ["Audit en trois couches", "Réseau : nmap, 6 hôtes, aucun Telnet, FTP ni SMBv1. Système : Lynis, 69/100 au départ, 20 suggestions. Configuration : Wazuh SCA, écarts CIS par agent, Windows compris. Aucun outil ne voit tout."], ["Onze constats", "F-01 domine (élevée) : l'hôte d'administration est dans le LAN qu'il administre. Puis F-03 RDP du DC ouvert, F-02 pfSense en HTTP, F-04 WS-Discovery, F-05 node_exporter, F-06 SSH/Cockpit ouverts, F-07 SSH, F-08 mots de passe, F-09 protocoles, F-10 USB, F-11 mises à jour."], ["EBIOS Risk Manager", "5 ateliers : 4 valeurs métier, 4 couples source/objectif, 5 chemins d'attaque, 4 scénarios opérationnels, 12 mesures. Chaque scénario part d'un constat réel."], ["Trajectoire du risque", "SO-1 rançongiciel, SO-2 annuaire, SO-3 hyperviseur, SO-4 supervision. Après les 12 mesures : plus aucun scénario critique. G = gravité, V = vraisemblance."], ["Octobre : mesurer avant de décider", "Mémoire mesurée VM par VM avant d'ajouter lnx-dc01 (F-23), volumes de journaux mesurés avant de fixer la rétention (F-21). 18 fiches en 6 jours, chacune avec constat, cause, correction, preuve, enseignement."]]}, {"cp": "CP9", "title": "Élaborer et appliquer la politique de sécurité", "items": [["PSSI applicable", "12 articles avec DOIT / NE DOIT PAS, chaque règle contrôlable. 8 rôles, du RSSI à l'auditeur. Notification CNIL sous 72 h intégrée."], ["Durcir et mesurer", "Lynis 69 → 76 : SSH durci (F-07), mots de passe et umask (F-08), protocoles coupés (F-09), USB neutralisé (F-10), mises à jour auto (F-11), port 9100 fermé (F-05). F-01 accepté, compensé, daté."], ["Restauration prouvée", "3 copies (miroir, instantanés, réplique), RTO < 1 s, RPO ≤ 1 h, 3/3 empreintes conformes (PV-01). Une sauvegarde n'existe que restaurée."], ["Sensibiliser", "45 minutes, deux publics (utilisateurs, équipe technique), 5 thèmes, quiz de 5 questions, phishing simulé à J+30. Après INC-04 : un code QR WireGuard est un secret."], ["Octobre : la politique imposée", "Les deux domaines étaient à 7 caractères sans verrouillage. Désormais 14 caractères et verrou après 10 échecs (15 min) ; PSO-Admins 20 caractères, verrou après 5 (30 min) (F-24)."], ["Octobre : moindre privilège", "Le préréglage TrueNAS donnait Domain Users en modification : ramené à DL_SMB_*_RW/RO, prouvé par 6 accès dont 2 refus (PV-05). GPO qui interdit la navigation sur le DC (F-17). SSH du DC par clé, adm.rj seul (PV-07)."], ["Octobre : continuité", "Le DC Windows en évaluation expire vers le 27/03/2027. Second domaine Samba infrasec.internal (PV-08), migration écrite de J-30 à J+30 (PROC-01), sauvegarde du labo en lecture seule (PV-09)."]]}, {"cp": "CP10", "title": "Détecter et traiter les incidents", "items": [["Détecter vite", "15 essais SSH depuis l'hôte : 15/15 détectés, alerte qualifiée T1110 en moins d'une minute (règle 100100 : 5 échecs en 60 s → alerte en 2 s)."], ["Incident réel INC-04", "Un code QR WireGuard lu par l'appareil photo : clé compromise. Événement → qualification → confinement (ancienne clé retirée) → éradication (nouvelle paire) → rétablissement (tunnel vérifié) → RETEX (consigne ajoutée)."], ["Journal et veille", "INC-01 à INC-07, chacun produit une règle. Veille : CERT-FR, ANSSI, NVD ; qualifier, décider, tracer, puis détecter."], ["Le fil F-01", "Constat F-01 → scénario SO-3 → attaque simulée depuis l'hôte (PV-03) → test faussé (INC-05) → risque accepté, motivé, daté → mesure M-01 : réseau d'administration séparé."], ["Octobre : rendre visible ce qui était sous     <p class="note">Tout autre flux entrant sur le SIEM et sur lnx-dc01 est refusé (F-15, F-25). Chaque règle est testée depuis une machine tierce.</p>
  </div></section>`;
  drawStep();
  app.querySelectorAll('[data-node]').forEach(b => b.onclick = () => openSheet(b.dataset.node));
  app.querySelectorAll('[data-path]').forEach(b => b.onclick = () => { S.path = b.dataset.path; S.step = 0; viewArchi(); });
  $('#prev').onclick = () => { if (S.step > 0){ S.step--; drawStep(); } };
  $('#next').onclick = () => { const n = DATA.paths.find(x => x.id === S.path).steps.length; S.step = (S.step + 1) % n; drawStep(); };
  app.querySelectorAll('[data-osi]').forEach(b => b.onclick = () => { const box = b.nextElementSibling; const open = box.hidden; box.hidden = !open; b.setAttribute('aria-expanded', open); });
  $('#openMaster').onclick = () => openFig('Architecture générale (dossier)', DATA.master.svg + `<div class="abbr" style="margin:10px">${DATA.master.abbrHtml}</div>`, 1000);
}
function drawStep(){
  const p = DATA.paths.find(x => x.id === S.path), st = p.steps[S.step];
  const order = []; p.steps.forEach(s => { if (!order.includes(s[0])) order.push(s[0]); });
  const name = id => (DATA.topo.find(t => t.id === id) || {name:id}).name;
  $('#chain').innerHTML = order.map(id => `<span class="${id===st[0]?'on':''}">${esc(name(id))}</span>`).join('<i>→</i>');
  $('#stepn').textContent = String(S.step + 1).padStart(2, '0');
  $('#stepL').innerHTML = `<span class="L ${st[1]}">${st[1]}</span>`;
  $('#stepT').innerHTML = esc(st[2]);
  $('#prev').disabled = S.step === 0;
  $('#next').textContent = S.step === p.steps.length - 1 ? 'Recommencer ↺' : 'Étape suivante ▶';
  $('#dots').innerHTML = p.steps.map((_, i) => `<i class="${i<=S.step?'on':''}"></i>`).join('');
  document.querySelectorAll('#topo .node').forEach(n => n.classList.toggle('on', n.dataset.node === st[0]));
}
function openSheet(id){
  closeOverlays();
  const v = DATA.vms.find(x => x.id === id);
  const el = document.createElement('div'); el.className = 'sheet'; el.setAttribute('role','dialog');
  if (!v){
    const n = DATA.topo.find(t => t.id === id);
    el.innerHTML = `<h3>${esc(n.name)}</h3><p class="lead">${id==='inet' ? "Aucun service du labo n'est exposé. Seul UDP 51820 répond sur le WAN de pfSense, et seulement aux clés déclarées." : "Box du domicile 192.168.1.0/24, ou partage de connexion du téléphone. Cockpit (9090) n'est joignable que depuis ce réseau (INC-08)."}</p><button class="btn" data-close>Fermer</button>`;
  } else {
    el.innerHTML = `<div class="vmhead"><div><h3>${esc(v.title)}</h3><div class="ip">${esc(v.ip)}</div></div>${layerBadge(v.badge)}</div>
      <p style="margin:0">${esc(v.table[0][1])}</p><p class="note">${esc(v.foot)}</p>
      <div class="ctrl"><button class="btn red" data-go="${v.id}">Ouvrir la fiche machine</button><button class="btn" data-close>Fermer</button></div>`;
  }
  document.body.appendChild(el);
  el.querySelectorAll('[data-close]').forEach(b => b.onclick = closeOverlays);
  const g = el.querySelector('[data-go]'); if (g) g.onclick = () => { S.vm = g.dataset.go; store.set('vm', S.vm); closeOverlays(); location.hash = 'machines'; };
}
function closeOverlays(){ document.querySelectorAll('.sheet,.ov').forEach(e => e.remove()); }
function openFig(title, svg, w){
  closeOverlays();
  const el = document.createElement('div'); el.className = 'ov'; el.setAttribute('role','dialog');
  let z = Math.max(1, Math.round(Math.min(window.innerWidth * 1.6, w) / 10) * 10);
  el.innerHTML = `<div class="bar"><b>${esc(title)}</b><button class="btn" data-z="-1">−</button><button class="btn" data-z="1">+</button><button class="btn red" data-close>Fermer</button></div><div class="sc">${svg}</div>`;
  document.body.appendChild(el);
  const s = el.querySelector('svg'); const apply = () => { s.style.width = z + 'px'; }; apply();
  el.querySelectorAll('[data-z]').forEach(b => b.onclick = () => { z = Math.max(320, Math.min(2400, z + (+b.dataset.z) * 160)); apply(); });
  el.querySelector('[data-close]').onclick = closeOverlays;
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeOverlays(); });

/* ---------------- MACHINES ---------------- */
function flowRow(r, dir){
  const ok = r[3] !== false;
  return `<div class="fl ${ok?'':'no'}"><span class="ic">${ok?'✓':'✕'}</span><div>${veil(`<b>${esc(r[0])}</b>${esc(r[2])}`)}</div><span class="pt">${esc(r[1])}</span></div>`;
}
function viewMachines(){
  const v = DATA.vms.find(x => x.id === S.vm) || DATA.vms[0];
  app.innerHTML = `<section class="view">
  <div class="block"><span class="kick">// Architecture par machine</span><h1>Huit fiches, trois questions chacune</h1>
  <p class="lead">Qui peut la joindre, sur quel port ? Que contacte-t-elle ? Que se passe-t-il dedans ? Active le mode mémoire pour te tester.</p></div>
  <div class="chips" role="group" aria-label="Machine">${DATA.vms.map(x => `<button class="chip" data-vm="${x.id}" aria-pressed="${x.id===v.id}">${esc(x.name.split(' (')[0])}</button>`).join('')}</div>
  <div class="vmhead"><div><h2>${esc(v.title)}</h2><div class="ip">${esc(v.ip)}</div></div>${layerBadge(v.badge)}</div>
  <div class="kv">${v.table.map(r => `<div>${esc(r[0])}</div><div>${veil(code(r[1]))}</div>`).join('')}</div>
  <div class="flows"><div class="flist"><h3>Entrant</h3>${v.inn.map(r => flowRow(r)).join('')}</div><div class="flist"><h3>Sortant</h3>${v.out.map(r => flowRow(r)).join('')}</div></div>
  <p class="note">${esc(v.foot)}</p>
  <div class="block"><h2>Organigramme interne</h2><p class="lead">${esc(v.flowcap)}</p>
    <div class="flow">${v.flow.map((f,i) => `<div class="fs ${f.k||''}"><div class="rail"><i><span>${f.k==='dec'?'?':i+1}</span></i></div>
      <div class="card"><b>${esc(f.t)}</b>${veil(`<p>${esc((f.d||[]).join(' '))}</p>${(f.yes||f.no)?`<div class="yn">${f.yes?`<span>${esc(f.yes)} → suite</span>`:''}${f.no?`<span class="n">${esc(f.no)}</span>`:''}</div>`:''}`)}</div></div>`).join('')}</div>
  </div>
  <div class="abbr"><span class="h">Abréviations · ${esc(v.name)}</span>${v.abbrHtml}</div>
  <details class="figs"><summary>Schémas du dossier pour cette machine</summary><div>
    <div class="svgscroll">${v.netsvg}</div><p class="cap">Flux réseau de ${esc(v.name)} : sources autorisées à gauche, destinations à droite.</p>
    <div class="svgscroll">${v.flowsvg}</div><p class="cap">${esc(v.flowcap)}</p></div></details>
  </section>`;
  app.querySelectorAll('[data-vm]').forEach(b => b.onclick = () => { S.vm = b.dataset.vm; store.set('vm', S.vm); viewMachines(); window.scrollTo(0,0); });
}

/* ---------------- CP ---------------- */
const FIGCP = { CP8:['memoire'], CP9:['agdlp','dnscroise','migration','sauvegarde'], CP10:['detection','scellement'] };
function viewCP(){
  const c = DATA.cp.find(x => x.cp === S.cp);
  const extra = {
    CP8: `<div class="block"><h2>Réponses aux 5 remarques du jury</h2><div class="cards">${DATA.jury.map(j => `<div class="it oct"><h3>${esc(j[0])}</h3>${veil(`<p>${esc(j[1])}</p>`)}</div>`).join('')}</div></div>
          <div class="block"><h2>Les 4 défauts qui reviennent</h2><div class="cards">${DATA.defauts.map(d => `<div class="it"><h3>${esc(d[0])}</h3>${veil(`<p>${esc(d[1])}</p><p style="color:var(--ok);margin-top:4px">${esc(d[2])}</p>`)}</div>`).join('')}</div></div>`,
    CP9: `<div class="block"><h2>Disponibilité et sécurité</h2><p class="lead">Elles ne s'opposent pas : elles se conçoivent ensemble.</p><div class="cards">${DATA.dispo.map(d => `<div class="it"><h3>${esc(d[0])}</h3>${veil(`<div class="tri"><div><small>Ce qui cassait l'autre objectif</small>${esc(d[1])}</div><div><small>Mesure retenue</small>${esc(d[2])}</div></div>`)}</div>`).join('')}</div></div>`,
    CP10: `<div class="block"><h2>Règles locales Wazuh</h2><div class="tbl"><table><thead><tr><th>Règle</th><th>MITRE</th><th>Parent</th><th>Niveau</th><th>Preuve</th></tr></thead><tbody>${DATA.rules.map(r => `<tr><td class="mono">${r[0]}</td><td><b>${r[1]}</b><br>${esc(r[2])}</td><td class="mono">${r[3]}</td><td class="mono">${r[4]}</td><td>${esc(r[5])}</td></tr>`).join('')}</tbody></table></div><p class="note">Seuil d'alerte du labo : niveau 10. Chaque règle est validée par <code>wazuh-analysisd -t</code> avant rechargement, puis l'attaque est rejouée.</p></div>
           <div class="block"><h2>Travaux restants, assumés</h2><div class="cards">${DATA.remain.map(r => `<div class="it"><p>${esc(r)}</p></div>`).join('')}</div></div>`
  }[S.cp];
  app.innerHTML = `<section class="view">
  <div class="block"><span class="kick">// Participer à la gestion de la cybersécurité</span><h1>${esc(c.cp)} · ${esc(c.title)}</h1></div>
  <div class="seg" role="group">${['CP8','CP9','CP10'].map(k => `<button data-cp="${k}" aria-pressed="${k===S.cp}">${k}</button>`).join('')}</div>
  <div class="cards">${c.items.map(it => `<div class="it ${it[0].startsWith('Octobre')?'oct':''}">${it[0].startsWith('Octobre')?'<span class="tag">Complément d’octobre</span>':''}<h3>${esc(it[0].replace(/^Octobre : /,''))}</h3>${veil(`<p>${esc(it[1])}</p>`)}</div>`).join('')}</div>
  ${extra}
  <div class="block"><h2>Figures du dossier</h2>${FIGCP[S.cp].map(k => `<div class="svgscroll">${DATA.figs[k].svg}</div><p class="cap">${esc(DATA.figs[k].cap)}</p><div class="abbr"><span class="h">Abréviations</span>${DATA.figs[k].abbrHtml}</div>`).join('')}</div>
  </section>`;
  app.querySelectorAll('[data-cp]').forEach(b => b.onclick = () => { S.cp = b.dataset.cp; viewCP(); });

/* ---------------- FICHES ---------------- */
const SETS = { oct:['Octobre (18 fiches)', f => f[1]==='oct'], pv:['PV et procédure', f => f[1]==='pv'], core:['Incidents 21/10', f => f[1]==='core'], todo:['À revoir', f => S.known[f[0]] !== true] };
function deck(){ return DATA.fiches.filter(SETS[S.fcSet][1]); }
function viewFiches(){
  const d = deck(); if (S.fcI >= d.length) S.fcI = 0;
  const f = d[S.fcI];
  const known = DATA.fiches.filter(x => S.known[x[0]] === true).length;
  app.innerHTML = `<section class="view">
  <div class="block"><span class="kick">// Journal des incidents et constats</span><h1>Cartes de révision</h1>
  <p class="lead">Recto : la fiche. Verso : constat, cause, correction et preuve. ${known} / ${DATA.fiches.length} fiches marquées comme sues.</p></div>
  <div class="chips" role="group">${Object.entries(SETS).map(([k,v]) => `<button class="chip" data-set="${k}" aria-pressed="${k===S.fcSet}">${v[0]}</button>`).join('')}</div>
  ${f ? `<div class="flash" id="flash" role="button" tabindex="0" aria-label="Retourner la carte"><div class="in">
    <div class="face front"><span class="fid">${esc(f[0])}</span><span class="ft">${esc(f[3])}</span>${f[2]?`<span class="tag">gravité ${esc(f[2])}</span>`:''}<span class="hint">Toucher pour retourner</span></div>
    <div class="face back"><span class="kick">${esc(f[0])}</span><dl><div><dt>${f[1]==='pv'?'Objet':'Constat et cause'}</dt><dd>${esc(f[4])}</dd></div><div><dt>${f[1]==='pv'?'Preuve':'Correction et preuve'}</dt><dd>${esc(f[5])}</dd></div></dl></div></div></div>
  <div class="fc-nav"><button class="btn" id="fprev">◀</button><button class="btn" id="fnext">▶</button><button class="btn ok" id="fknow">${S.known[f[0]]?'Sue ✓':'Je la sais'}</button><span class="count">${S.fcI+1} / ${d.length}</span></div>`
  : `<div class="it"><p>Toutes les fiches de cette pile sont marquées comme sues. Choisis une autre pile.</p></div>`}
  <div class="block"><h2>Les 18 fiches d'octobre en un tableau</h2><div class="tbl"><table><thead><tr><th>Fiche</th><th>Constat</th><th>Gravité</th><th>Correction et preuve</th></tr></thead><tbody>
  ${DATA.fiches.filter(x => x[1]==='oct').map(x => `<tr><td class="mono">${x[0]}</td><td>${esc(x[3])}</td><td>${esc(x[2])}</td><td>${veil(esc(x[5]))}</td></tr>`).join('')}</tbody></table></div></div>
  </section>`;
  app.querySelectorAll('[data-set]').forEach(b => b.onclick = () => { S.fcSet = b.dataset.set; S.fcI = 0; viewFiches(); });
  if (!f) return;
  const fl = $('#flash'); const flip = () => fl.classList.toggle('flip');
  fl.onclick = flip; fl.onkeydown = e => { if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); flip(); } };
  $('#fprev').onclick = () => { S.fcI = (S.fcI - 1 + d.length) % d.length; viewFiches(); };
  $('#fnext').onclick = () => { S.fcI = (S.fcI + 1) % d.length; viewFiches(); };
  $('#fknow').onclick = () => { S.known[f[0]] = !S.known[f[0]]; store.set('known', S.known); if (S.fcSet !== 'todo') S.fcI = (S.fcI + 1) % d.length; viewFiches(); };
}

/* ---------------- QUIZ ---------------- */
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function newQuiz(only){
  const pool = only ? only : DATA.quiz.map((_, i) => i);
  S.quiz = { order: shuffle(pool), i: 0, score: 0, wrong: [], answered: false };
}
function viewQuiz(){
  if (!S.quiz) newQuiz();
  const Q = S.quiz;
  if (Q.i >= Q.order.length){
    const best = store.get('best', 0); const pct = Math.round(100 * Q.score / Q.order.length);
    if (Q.order.length === DATA.quiz.length && Q.score > best) store.set('best', Q.score);
    app.innerHTML = `<section class="view"><div class="block"><span class="kick">// Résultat</span><div class="score">${Q.score} / ${Q.order.length}</div>
      <p class="lead">${pct >= 85 ? "Prêt pour le jury sur ce point." : pct >= 60 ? "Bonne base. Reprends les questions manquées." : "Repasse par Archi et Machines, puis recommence."}</p></div>
      <div class="ctrl" style="flex-wrap:wrap">${Q.wrong.length ? `<button class="btn red" id="qwrong">Revoir mes ${Q.wrong.length} erreurs</button>` : ''}<button class="btn" id="qagain">Nouveau quiz complet</button></div></section>`;
    const w = $('#qwrong'); if (w) w.onclick = () => { newQuiz(Q.wrong); viewQuiz(); };
    $('#qagain').onclick = () => { newQuiz(); viewQuiz(); };
    return;
  }
  const q = DATA.quiz[Q.order[Q.i]];
  const opts = shuffle(q[1].map((t, k) => [t, k]));
  app.innerHTML = `<section class="view">
  <div class="block"><span class="kick">// Quiz · question ${Q.i+1} sur ${Q.order.length} · score ${Q.score}</span><div class="qbar"><i style="width:${100*Q.i/Q.order.length}%"></i></div></div>
  <div class="qq">${esc(q[0])}</div>
  <div class="opts">${opts.map(o => `<button class="opt" data-k="${o[1]}">${esc(o[0])}</button>`).join('')}</div>
  <div id="qwhy"></div>
  <div class="ctrl"><button class="btn red" id="qnext" hidden>Question suivante ▶</button><span class="legend" style="margin-left:auto">Meilleur score : ${store.get('best',0)} / ${DATA.quiz.length}</span></div></section>`;
  Q.answered = false;
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    if (Q.answered) return; Q.answered = true;
    const ok = +b.dataset.k === q[2];
    if (ok) Q.score++; else Q.wrong.push(Q.order[Q.i]);
    app.querySelectorAll('.opt').forEach(x => { if (+x.dataset.k === q[2]) x.classList.add('good'); });
    if (!ok) b.classList.add('bad');
    $('#qwhy').innerHTML = `<div class="why"><b style="color:${ok?'var(--ok)':'var(--red2)'}">${ok?'Exact.':'Non.'}</b> ${esc(q[3])}</div>`;
    $('#qnext').hidden = false; $('#qnext').focus();
  });
  $('#qnext').onclick = () => { Q.i++; viewQuiz(); window.scrollTo(0,0); };
}

/* ---------------- ORAL ---------------- */
function viewOral(){
  app.innerHTML = `<section class="view">
  <div class="block"><span class="kick">// À dire devant le jury</span><h1>Dix phrases à savoir par cœur</h1>
  <p class="lead">Une phrase courte par idée. Le détail technique vient ensuite, si le jury le demande.</p></div>
  <ol class="oral">${DATA.oral.map(o => `<li>${veil(esc(o))}</li>`).join('')}</ol>
  <div class="block"><h2>Abréviations</h2><input class="search" id="q" type="search" placeholder="Chercher : SIEM, AGDLP, FIM…" aria-label="Chercher une abréviation">
  <div class="gl" id="gl"></div></div></section>`;
  const draw = t => { t = t.trim().toLowerCase(); $('#gl').innerHTML = DATA.abbr.filter(a => !t || a[0].toLowerCase().includes(t) || a[1].toLowerCase().includes(t)).map(a => `<div><b>${esc(a[0])}</b><span>${esc(a[1])}</span></div>`).join('') || '<div><span>Aucune abréviation trouvée.</span></div>'; };
  $('#q').oninput = e => draw(e.target.value); draw('');
}

/* ---------------- router ---------------- */
const VIEWS = { archi:viewArchi, machines:viewMachines, cp:viewCP, fiches:viewFiches, quiz:viewQuiz, oral:viewOral };
function route(){
  const h = location.hash.slice(1); const k = VIEWS[h] ? h : 'archi';
  closeOverlays(); VIEWS[k]();
  document.querySelectorAll('nav.tabs a').forEach(a => a.setAttribute('aria-current', a.getAttribute('href') === '#'+k ? 'page' : 'false'));
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route); route();
</script>
