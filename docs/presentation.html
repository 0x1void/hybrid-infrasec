" font-size=\"11.8\" text-anchor=\"start\" >read-only lab-backup backup (PV-09)<\/text><\/svg>", "text": "The full network architecture. At the top, the topology: access network, host, NAT network, pfSense, then the isolated LAN with every server and its ports. At the bottom, the same lab read layer by layer, from the hardware (L1) to the applications (L7), with the security control in place at each layer.", "abbr": "<b>L1…L7<\/b>: OSI layers: 1 physical, 2 data link, 3 network, 4 transport, 5 session, 6 presentation, 7 application · <b>OSI<\/b>: 7-layer reference model (Open Systems Interconnection) · <b>HV01<\/b>: lab hypervisor, host name TeneT · <b>KVM<\/b>: Kernel-based Virtual Machine · <b>LUKS<\/b>: Linux Unified Key Setup, full-disk encryption · <b>BTRFS<\/b>: B-tree file system, with snapshots · <b>NAT<\/b>: Network Address Translation · <b>WAN<\/b>: outside of the firewall (NAT network 192.168.122.0/24) · <b>LAN<\/b>: lab local network 10.10.10.0/24 · <b>WG<\/b>: WireGuard: encrypted VPN tunnel, UDP port 51820 · <b>DNS<\/b>: Domain Name System · <b>NTP<\/b>: Network Time Protocol · <b>AD DS<\/b>: Active Directory Domain Services · <b>LDAP<\/b>: Lightweight Directory Access Protocol · <b>SMB<\/b>: Server Message Block file sharing, port 445 · <b>SNMP<\/b>: Simple Network Management Protocol, UDP port 161 · <b>TLS<\/b>: Transport Layer Security · <b>SSH<\/b>: Secure Shell remote administration, port 22 · <b>GPO<\/b>: Group Policy Object · <b>AGDLP<\/b>: Accounts → Global groups → Domain Local groups → Permissions · <b>RBAC<\/b>: Role-Based Access Control · <b>FIM<\/b>: File Integrity Monitoring · <b>whodata<\/b>: Wazuh FIM mode that also records the user and the process · <b>TCP / UDP<\/b>: transport protocols, connection-oriented or not · <b>ufw<\/b>: Debian/Ubuntu host firewall (Uncomplicated Firewall) · <b>DC<\/b>: Domain Controller · <b>SIEM<\/b>: Security Information and Event Management · <b>VM<\/b>: virtual machine · <b>Gio / Go<\/b>: gibibytes (memory, 2³⁰ bytes) / gigabytes (disk, 10⁹ bytes) · <b>agent invité<\/b>: QEMU guest agent: service in the VM that takes orders from the hypervisor"}, {"kind": "fig", "part": "CCP2 · The evolution", "title": "Project schedule, from the foundation to the lab closure on 26/10/2026", "svg": "<svg class=\"fig\" viewBox=\"0 0 1000 560\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"0\" y=\"0\" width=\"1000\" height=\"560\" rx=\"0\" class=\"fig-bg\" /><rect x=\"14\" y=\"8\" width=\"18\" height=\"12\" rx=\"3\" class=\"bar-done\" /><text x=\"38\" y=\"19\" class=\"tm\" font-size=\"12\" text-anchor=\"start\" >done (foundation and project)<\/text><rect x=\"250\" y=\"8\" width=\"18\" height=\"12\" rx=\"3\" class=\"bar-new\" /><text x=\"274\" y=\"19\" class=\"tm\" font-size=\"12\" text-anchor=\"start\" >done after the oral exam (CCP3)<\/text><line x1=\"399.35483870967744\" y1=\"40\" x2=\"399.35483870967744\" y2=\"500\" class=\"grid\"/><text x=\"399.35483870967744\" y=\"36\" class=\"tm\" font-size=\"11.5\" text-anchor=\"middle\" >26/09<\/text><line x1=\"476.7741935483871\" y1=\"40\" x2=\"476.7741935483871\" y2=\"500\" class=\"grid\"/><text x=\"476.7741935483871\" y=\"36\" class=\"tm\" font-size=\"11.5\" text-anchor=\"middle\" >30/09<\/text><line x1=\"554.1935483870968\" y1=\"40\" x2=\"554.1935483870968\" y2=\"500\" class=\"grid\"/><text x=\"554.1935483870968\" y=\"36\" class=\"tm\" font-size=\"11.5\" text-anchor=\"middle\" >04/10<\/text><line x1=\"631.6129032258065\" y1=\"40\" x2=\"631.6129032258065\" y2=\"500\" class=\"grid\"/><text x=\"631.6129032258065\" y=\"36\" class=\"tm\" font-size=\"11.5\" text-anchor=\"middle\" >08/10<\/text><line x1=\"709.0322580645161\" y1=\"40\" x2=\"709.0322580645161\" y2=\"500\" class=\"grid\"/><text x=\"709.0322580645161\" y=\"36\" class=\"tm\" font-size=\"11.5\" text-anchor=\"middle\" >12/10<\/text><line x1=\"786.4516129032259\" y1=\"40\" x2=\"786.4516129032259\" y2=\"500\" class=\"grid\"/><text x=\"78 ght=\"30\" rx=\"15\" class=\"pill-ok\" /><text x=\"386\" y=\"308\" class=\"tt\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"700\" >employee → TrueNAS only<\/text><rect x=\"528\" y=\"288\" width=\"200\" height=\"30\" rx=\"15\" class=\"pill-deny\" /><text x=\"628\" y=\"308\" class=\"tdeny\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"700\" >everything else: denied<\/text><\/svg>", "text": "The chosen architecture: one UDP port, one encrypted tunnel, two separated profiles. The administrator reaches the whole LAN; the employee reaches the file share only. Everything else is refused and logged.", "abbr": "<b>WG<\/b>: WireGuard: encrypted VPN tunnel, UDP port 51820 · <b>WAN<\/b>: outside of the firewall (NAT network 192.168.122.0/24) · <b>LAN<\/b>: lab local network 10.10.10.0/24 · <b>TCP / UDP<\/b>: transport protocols, connection-oriented or not · <b>L1…L7<\/b>: OSI layers: 1 physical, 2 data link, 3 network, 4 transport, 5 session, 6 presentation, 7 application"}, {"kind": "fig", "part": "CCP2 · The evolution", "title": "What an employee connection goes through: three barriers", "svg": "<svg class=\"fig\" viewBox=\"0 0 1000 212\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"0\" y=\"0\" width=\"1000\" height=\"212\" rx=\"0\" class=\"fig-bg\" /><rect x=\"20.0\" y=\"40\" width=\"160.0\" height=\"92\" rx=\"8\" class=\"box-red\" /><circle cx=\"36.0\" cy=\"57\" r=\"10\" class=\"num\"/><text x=\"36.0\" y=\"61.5\" class=\"numt\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"700\" >1<\/text><text x=\"52.0\" y=\"62\" class=\"tt\" font-size=\"12.8\" text-anchor=\"start\" font-weight=\"700\" >Connection<\/text><text x=\"32.0\" y=\"84\" class=\"tm\" font-size=\"11.2\" text-anchor=\"start\" >of the employee<\/text><line x1=\"180.0\" y1=\"86.0\" x2=\"218.0\" y2=\"86.0\" class=\"ln-red\" marker-end=\"url(#ah)\"/><rect x=\"220.0\" y=\"40\" width=\"160.0\" height=\"92\" rx=\"8\" class=\"box-dec\" /><circle
